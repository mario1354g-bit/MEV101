[package]
name = "longtail-mev-monitor"
version = "0.1.0"
edition = "2021"

[dependencies]
alloy = { version = "0.9", features = ["full", "providers", "signers", "contract", "rpc-types", "json-rpc", "rlp", "network", "consensus", "eips", "sol-types"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
futures = "0.3"
async-trait = "0.1"
hex = "0.4"
dotenv = "0.15"
reqwest = { version = "0.12", features = ["json"] }
eyre = "0.6"
url = "2"
num_cpus = "1.16"
revm = { version = "19", features = ["std", "serde"] }
parking_lot = "0.12"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

[profile.bench]
debug = true
